      test: bb2d8be9560329f81a652e747b42dee698588c2e639ee119317231c911fa5d39

evaluation:
  primary: macro_f1
  direction: maximize
  calibration_folds: 5
  secondary:
    - accuracy
    - per_class_precision_recall_f1
    - confusion_matrix
    - ordinal_mae
    - quadratic_weighted_kappa
    - far_error_rate
    - negative_log_likelihood
    - brier_score
    - expected_calibration_error
    - entropy
    - abstention_coverage
    - parameter_count
    - training_time
    - inference_latency
    - peak_vram
  screen_seeds: [42]
  confirmation_seeds: [42, 123, 456, 789, 2024]
  screening:
    max_epochs: 20
    patience: 7
    gpu_minutes: 90
    minimum_macro_f1_gain: 0.005
  confirmation:
    minimum_mean_macro_f1_gain: 0.010
    paired_bootstrap_samples: 10000
    confidence: 0.95
    require_lower_bound_above: 0.0
  tie_break:
    macro_f1_tolerance: 0.002
    prefer: simpler_then_cheaper
  guardrail_floors:
    perturbation_macro_f1_regression: 0.010
    supported_slice_or_class_f1_regression: 0.020
    ordinal_mae_regression: 0.020
    quadratic_weighted_kappa_regression: 0.010
    expected_calibration_error_regression: 0.020
    supported_slice_minimum_examples: 50
  abstention_thresholds: [0.50, 0.60, 0.70, 0.80, 0.90]
  robustness:
    slices: [cefr, pos, frequency, lemma_length, morphology, context_availability, oov]
    perturbations: [unicode_normalization, case, punctuation_whitespace, controlled_character_noise, target_repetition, target_truncation, context_removal, context_distraction, weak_inflected_surface_forms]

budget_gpu_hours:
  total: 48
  protocol_and_five_seed_baselines: 6
  candidate_screening: 24
  five_seed_confirmations: 12
  finalization: 4
  reserve: 2

runtime:
  host: gpu5090
  accelerator: NVIDIA_RTX_5090
  environment: environment.yml
  encrypted_remote_root_required: ESAI_RA_ZHANTORE
  local_mirror: remote_mirror/ar-cycle2-refine-20260810

queue: [engineering_validity, diagnostic_ablations, objectives, training_system, architecture, robustness_training, derived_supervision, finalization]

derived_supervision:
  source: external_unlabeled_train_only
  required_teacher_seed_agreement: 5
  minimum_probability: 0.90
  maximum_relative_to_gold_train: 1.0
  balance_by_predicted_class: true
  require_gold_only_ablation: true

commands:
  build_splits: python3 scripts/build_research_splits.py --config config/autoresearch_cycle2_refinement.yaml
  screen: python3 scripts/run_autoresearch.py --research-config config/autoresearch_cycle2_refinement.yaml --proposal-id PROPOSAL --hypothesis HYPOTHESIS --baseline-manifest BASELINE_MANIFEST --baseline-robustness BASELINE_ROBUSTNESS --robustness-input ROBUSTNESS_INPUT MODEL_ARGS
  confirmation_seed: python3 scripts/train_dual.py --research-config config/autoresearch_cycle2_refinement.yaml --proposal-id PROPOSAL --seed SEED MODEL_ARGS
  champion_lock: python3 scripts/lock_champion.py --research-config config/autoresearch_cycle2_refinement.yaml --baseline-manifests BASELINE_5 --candidate-manifests CANDIDATE_5 --baseline-robustness BASELINE_ROBUSTNESS --candidate-robustness CANDIDATE_ROBUSTNESS --calibration-manifest CALIBRATION_MANIFEST --review-event REVIEW_A --review-event REVIEW_B --rebuttal-event REBUTTAL --decision-event DECISION --user-approved --output CHAMPION
  robustness_generate: python3 scripts/evaluate_robustness.py --research-config config/autoresearch_cycle2_refinement.yaml --input dataset/research/ar-cycle2-refine-20260810/dev.csv --output results/autoresearch/ar-cycle2-refine-20260810/robustness-inputs.csv
  robustness_infer: python3 scripts/train_dual.py --research-config config/autoresearch_cycle2_refinement.yaml --proposal-id PROPOSAL --seed SEED --robustness-input results/autoresearch/ar-cycle2-refine-20260810/robustness-inputs.csv
  robustness_score: python3 scripts/evaluate_robustness.py --research-config config/autoresearch_cycle2_refinement.yaml --predictions PREDICTIONS --output REPORT
  calibration: python3 scripts/calibrate_predictions.py --research-config config/autoresearch_cycle2_refinement.yaml --proposal-id PROPOSAL --oof-predictions OOF_PREDICTIONS --output CALIBRATED_PREDICTIONS
  final_test: python3 scripts/final_test.py --research-config config/autoresearch_cycle2_refinement.yaml --champion-manifest CHAMPION
