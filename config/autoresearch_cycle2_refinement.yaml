  context_cache: artifacts/context/lemma_sentences.json
  legacy_frequency_splits: dataset/splits
  output_dir: dataset/research/ar-cycle2-refine-20260810
  proportions: {train: 0.70, dev: 0.15, test: 0.15}
  seed: 42
  normalization: NFC-casefold
  near_duplicate_edit_distance: 1
  grouping: [normalized_lemma, near_duplicate_lemma, context_sentence_sha256]
  labels_keyed_by: [normalized_lemma, pos]
